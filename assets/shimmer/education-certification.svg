<svg xmlns="http://www.w3.org/2000/svg" width="940" height="72" viewBox="0 0 940 72" role="img" aria-label="Education &amp; Certification">
  <defs>
    <linearGradient id="glint" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.50" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="text-shape" clipPathUnits="userSpaceOnUse"><text x="35" y="47" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34">Education &amp; Certification</text></clipPath>
  </defs>
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 34px; fill: #C6BFB5; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; font-weight: 500; font-size: 19px; fill: #AEA8BD; }
    @media (prefers-reduced-motion: reduce) { .glimmer { display: none; } }
  </style>
  <rect x="1.5" y="1.5" width="937" height="69" rx="2" fill="#030611" stroke="#BBA8B0" stroke-opacity="0.60" stroke-width="1.5"/>
  <rect x="2.5" y="2.5" width="935" height="67" rx="1" fill="none" stroke="#151A36" stroke-width="3"/>
  <rect x="14" y="14" width="6" height="6" fill="#BBA8B0" opacity="0.65"/>
  <rect x="920" y="52" width="6" height="6" fill="#BBA8B0" opacity="0.65"/>
  <text x="35" y="47" class="title">Education &amp; Certification</text>
  <g clip-path="url(#text-shape)" class="glimmer">
    <rect x="-280" y="10" width="208" height="52" fill="url(#glint)" opacity="0.75">
      <animate attributeName="x" values="-280;1020" dur="8.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>